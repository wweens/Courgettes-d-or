<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les Courgettes d'Or — Archives</title>
<style>html,body,#archives{width:100%;height:100%;margin:0;border:0;display:block;background:#f5eddf}body{overflow:hidden}</style>
</head>
<body>
<iframe id="archives" src="archives.html" title="Les Courgettes d'Or"></iframe>
<script src="data-2025-2026.js"></script>
<script src="data-2024-2025.js"></script>
<script src="data-2023-2021.js"></script>
<script src="data-2018-2015.js"></script>
<script src="data-2014-2015.js"></script>
<script src="data-2013-2014.js"></script>
<script>
const docEntries=window.COURGETTES_DOC_DATA||[];
const seasonOrder=["2025-2026","2024-2025","2023-2024","2022-2023","2021-2022","2018-2019","2015-2016","2014-2015","2013-2014"];
const monthOrder=["SEPTEMBRE","OCTOBRE","NOVEMBRE","DÉCEMBRE","JANVIER","FÉVRIER","MARS","AVRIL","MAI","JUIN","JUILLET"];
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cleanSectionLabel(label){const n=norm(label).replace(/\s+/g,'').trim();if(n==='dujuin'||n==='juin')return'JUIN';if(n==='fevrier')return'FÉVRIER';for(const m of monthOrder){if(n===norm(m).replace(/\s+/g,''))return m}return String(label||'').trim()}
function sectionSortKey(label){const clean=cleanSectionLabel(label),n=norm(clean);const exact=monthOrder.findIndex(m=>norm(m)===n);if(exact>=0)return exact*10;if(n.includes('novembre')&&n.includes('janvier'))return 42;if(n.startsWith('automne'))return 25;if(n.startsWith('hiver'))return 45;if(n.includes('septembre'))return 0;if(n.includes('octobre'))return 10;if(n.includes('novembre'))return 20;if(n.includes('decembre'))return 30;if(n.includes('janvier'))return 40;if(n.includes('fevrier'))return 50;if(n.includes('mars'))return 60;if(n.includes('avril'))return 70;if(n.includes('mai'))return 80;if(n.includes('juin'))return 90;if(n.includes('juillet'))return 100;return 999}
function collectLegacyPhotos(doc){const a=[];doc.querySelectorAll('.quote-card').forEach(card=>{const img=card.querySelector('img');if(!img)return;const year=card.dataset.year||card.closest('[data-year]')?.dataset.year||'';a.push({year,text:(card.textContent||'').trim(),src:img.currentSrc||img.src||img.getAttribute('src')||''})});return a}
function findLegacyPhoto(e,photos){if(e.photo)return e.photo;const same=photos.filter(p=>p.year===e.year&&p.src);const n=norm(e.name);const exact=same.find(p=>norm(p.text).includes(n));if(exact)return exact.src;if(same.length===1)return same[0].src;return ''}
function addStyle(doc){if(doc.getElementById('doc-courgettes-style'))return;const s=doc.createElement('style');s.id='doc-courgettes-style';s.textContent=`#doc-seasons-root{display:block}.doc-toolbar{margin:0 0 2rem;padding:1.25rem 1.35rem;border-radius:20px;background:linear-gradient(135deg,rgba(126,35,53,.96),rgba(91,25,43,.96));box-shadow:0 14px 32px rgba(68,33,28,.18);color:#fff}.doc-toolbar-title{font-family:Georgia,serif;font-size:clamp(1.45rem,3vw,2.05rem);font-weight:800;margin:0 0 .35rem}.doc-toolbar-sub{margin:0 0 1rem;opacity:.88}.doc-toolbar-row{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center}.doc-filter-btn,.doc-random-btn{appearance:none;border:1px solid rgba(255,255,255,.38);border-radius:999px;padding:.58rem .86rem;background:rgba(255,255,255,.10);color:#fff;font:inherit;font-weight:800;cursor:pointer;transition:.15s ease}.doc-filter-btn:hover,.doc-random-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.18)}.doc-filter-btn.is-active{background:#fff;color:#7e2335;border-color:#fff}.doc-random-btn{background:#f3d77b;color:#5c2630;border-color:#f3d77b}.doc-random-zone{display:none;margin:1.15rem 0 0;padding:1rem 1.05rem;border-radius:15px;background:rgba(255,255,255,.96);color:#3d292a}.doc-random-zone.is-visible{display:block}.doc-random-meta{font-weight:900;color:#8b2438;margin-bottom:.35rem}.doc-random-text{white-space:pre-wrap;line-height:1.55}.doc-random-photo{display:block;max-width:100%;max-height:420px;object-fit:contain;border-radius:12px;margin-top:.65rem}.doc-season{margin-bottom:2.8rem}.doc-season-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin:0 0 1.35rem;padding:.25rem 0;border-bottom:3px solid #7e2335}.doc-season-head>div{display:flex;align-items:baseline;gap:1rem}.doc-season-head h2{margin:0;color:#8b2438;font-family:Georgia,serif;font-size:clamp(2.1rem,5vw,3.3rem)}.doc-season-head p{margin:0 0 .45rem;opacity:.65;font-weight:700}.doc-kicker{font-weight:900;letter-spacing:.08em;color:#806d5d}.doc-month>h2{margin-top:1.6rem}.doc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:1rem;margin:1rem 0 2rem}.doc-card{box-sizing:border-box}.doc-rank{display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0 0 .35rem;padding:.3rem .55rem;border-radius:999px;background:rgba(0,0,0,.06)}.doc-rank-or{background:#f2d77b}.doc-rank-argent{background:#d8dde3}.doc-rank-bronze{background:#dfb183}.doc-rank-outsider{background:#ead8dc}.doc-rank-bonus{background:#e6d9a5}.doc-text{font-size:1rem;line-height:1.55;margin:.7rem 0 0;white-space:pre-wrap}.doc-photo-wrap{width:100%;margin-top:.75rem;border-radius:12px;overflow:hidden;background:#eee7dc;display:flex;align-items:center;justify-content:center}.doc-photo{display:block;width:100%;height:auto;max-height:620px;object-fit:contain}.doc-photo-missing{white-space:pre-wrap;font-style:italic;opacity:.75}@media(max-width:640px){.doc-season-head{align-items:flex-start;flex-direction:column}.doc-season-head>div{display:block}.doc-season-head p{margin:0}.doc-photo{max-height:480px}.doc-toolbar{border-radius:14px;padding:1rem}.doc-filter-btn,.doc-random-btn{font-size:.88rem;padding:.5rem .7rem}}`;doc.head.appendChild(s)}
function badge(doc,e){if(e.noBadge)return null;const d=doc.createElement('div');const r=norm(e.rank);d.className=`doc-rank doc-rank-${r}`;const icon=e.rank==='Or'?'🥇':e.rank==='Argent'?'🥈':e.rank==='Bronze'?'🥉':e.rank==='Outsider'?'★':'✦';d.textContent=`${icon} ${e.rank}`;return d}
function createToolbar(doc,root,photos){const bar=doc.createElement('section');bar.className='doc-toolbar';bar.innerHTML=`<div class="doc-toolbar-title">Les Courgettes d’Or</div><p class="doc-toolbar-sub">Choisis un millésime, affiche les outsiders ou laisse le hasard ressortir une pépite des archives.</p>`;const row=doc.createElement('div');row.className='doc-toolbar-row';const all=doc.createElement('button');all.type='button';all.className='doc-filter-btn is-active';all.dataset.mode='all';all.textContent='Toutes';row.appendChild(all);seasonOrder.forEach(y=>{const b=doc.createElement('button');b.type='button';b.className='doc-filter-btn';b.dataset.mode=y;b.textContent=y;row.appendChild(b)});const outs=doc.createElement('button');outs.type='button';outs.className='doc-filter-btn';outs.dataset.mode='outsiders';outs.textContent='Outsiders';row.appendChild(outs);const random=doc.createElement('button');random.type='button';random.className='doc-random-btn';random.textContent='🎲 Une courgette au hasard';row.appendChild(random);bar.appendChild(row);const zone=doc.createElement('div');zone.className='doc-random-zone';bar.appendChild(zone);root.appendChild(bar);random.addEventListener('click',()=>{const candidates=docEntries.filter(e=>e.text||e.isPhoto);if(!candidates.length)return;const e=candidates[Math.floor(Math.random()*candidates.length)];const src=e.isPhoto?findLegacyPhoto(e,photos):'';zone.innerHTML=`<div class="doc-random-meta">${esc(e.year)} · ${esc(cleanSectionLabel(e.section))} · ${esc(e.rank)} — ${esc(e.name)}</div>`+(src?`<img class="doc-random-photo" src="${esc(src)}" alt="${esc(e.name)}">`:`<div class="doc-random-text">${esc(e.text)}</div>`);zone.classList.add('is-visible');zone.scrollIntoView({behavior:'smooth',block:'nearest'})});return bar}
function build(doc){const main=doc.querySelector('main');if(!main)return;const photos=collectLegacyPhotos(doc);[...main.children].forEach(x=>x.style.display='none');addStyle(doc);const old=doc.getElementById('doc-seasons-root');if(old)old.remove();const root=doc.createElement('div');root.id='doc-seasons-root';main.prepend(root);createToolbar(doc,root,photos);seasonOrder.forEach(year=>{const list=docEntries.filter(e=>e.year===year);if(!list.length)return;const season=doc.createElement('section');season.className='doc-season';season.dataset.year=year;const head=doc.createElement('div');head.className='doc-season-head';const left=doc.createElement('div');const k=doc.createElement('span');k.className='doc-kicker';k.textContent='MILLÉSIME';const h=doc.createElement('h2');h.textContent=year;left.append(k,h);const count=doc.createElement('p');count.textContent=`${list.length} courgettes`;head.append(left,count);season.appendChild(head);const sections=[...new Set(list.map(e=>e.section))].map((label,i)=>({label,clean:cleanSectionLabel(label),key:sectionSortKey(label),i})).sort((a,b)=>a.key-b.key||a.i-b.i);sections.forEach(({label,clean})=>{const block=doc.createElement('section');block.className='month-block doc-month';block.dataset.year=year;block.dataset.section=clean;const mh=doc.createElement('h2');mh.textContent=clean;block.appendChild(mh);const grid=doc.createElement('div');grid.className='doc-grid';list.filter(e=>e.section===label).forEach(e=>{const card=doc.createElement('article');card.className='quote-card doc-card';card.dataset.year=year;card.dataset.rank=e.rank;card.dataset.search=norm(`${e.name} ${clean} ${e.rank} ${e.text}`);const b=badge(doc,e);if(b)card.appendChild(b);const nh=doc.createElement('h3');nh.textContent=e.name;card.appendChild(nh);if(e.isPhoto){const src=findLegacyPhoto(e,photos);if(src){const wrap=doc.createElement('div');wrap.className='doc-photo-wrap';const img=doc.createElement('img');img.className='doc-photo';img.src=src;img.alt=e.name;img.loading='lazy';wrap.appendChild(img);card.appendChild(wrap)}else{const t=doc.createElement('div');t.className='doc-text doc-photo-missing';t.textContent=e.text;card.appendChild(t)}}else{const t=doc.createElement('div');t.className='doc-text';t.textContent=e.text;card.appendChild(t)}grid.appendChild(card)});block.appendChild(grid);season.appendChild(block)});root.appendChild(season)});setupControls(doc,root)}
function setupControls(doc,root){let mode='all',q='';const buttons=[...root.querySelectorAll('.doc-filter-btn')];function apply(){root.querySelectorAll('.doc-card').forEach(c=>{const y=c.dataset.year,r=norm(c.dataset.rank),s=c.dataset.search||'';const okMode=mode==='all'||mode===y||(mode==='outsiders'&&r==='outsider');c.style.display=okMode&&(!q||s.includes(q))?'':'none'});root.querySelectorAll('.doc-month').forEach(m=>{m.style.display=[...m.querySelectorAll('.doc-card')].some(c=>c.style.display!=='none')?'':'none'});root.querySelectorAll('.doc-season').forEach(s=>{s.style.display=[...s.querySelectorAll('.doc-card')].some(c=>c.style.display!=='none')?'':'none'});buttons.forEach(b=>b.classList.toggle('is-active',b.dataset.mode===mode));[...doc.querySelectorAll('body *')].forEach(el=>{if(el.children.length===0){const t=(el.textContent||'').trim();if(/^\d+ millésimes publiés retrouvés$/.test(t))el.textContent='9 millésimes publiés retrouvés';if(/^\d+ courgettes affichées$/.test(t))el.textContent='248 courgettes affichées'}})}buttons.forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode||'all';apply()}));const search=doc.querySelector('input[type="search"],input[placeholder*="Prénom"],input[placeholder*="prenom" i]');if(search)search.addEventListener('input',()=>{q=norm(search.value);apply()},true);apply()}
document.getElementById('archives').addEventListener('load',function(){try{build(this.contentDocument);this.contentDocument.title="Les Courgettes d'Or — Archives"}catch(e){console.error(e)}});
</script>
</body>
</html>
