const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function childRun(doc,code){const s=doc.createElement('script');s.textContent=code;doc.body.appendChild(s);s.remove();}
function styleInjected(doc){if(doc.getElementById('courgettes-injected-style'))return;const style=doc.createElement('style');style.id='courgettes-injected-style';style.textContent=`.injected-season{margin-bottom:2.5rem}.current-season-title{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin:0 0 1.4rem;padding:.25rem 0;border-bottom:3px solid #7e2335}.current-season-title>div{display:flex;align-items:baseline;gap:1rem}.current-season-title h2{margin:0;color:#8b2438;font-family:Georgia,serif;font-size:clamp(2.1rem,5vw,3.3rem)}.current-season-title p{margin:0 0 .45rem;opacity:.65;font-weight:700}.current-kicker{font-weight:900;letter-spacing:.08em;color:#806d5d}.injected-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:1rem;margin:1rem 0 2rem}.injected-card{box-sizing:border-box}.injected-rank{display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0 0 .35rem;padding:.3rem .55rem;border-radius:999px;background:rgba(0,0,0,.06)}.rank-or{background:#f2d77b}.rank-argent{background:#d8dde3}.rank-bronze{background:#dfb183}.rank-outsider{background:#ead8dc}.injected-month>h2{margin-top:1.6rem}.injected-text{font-size:1rem;line-height:1.55;margin:.7rem 0 0}.courgette-photo-wrap{width:100%;margin-top:.75rem;border-radius:12px;overflow:hidden;background:#eee7dc;display:flex;align-items:center;justify-content:center}.courgette-photo{display:block;width:100%;height:auto;max-height:620px;object-fit:contain}@media(max-width:640px){.current-season-title{align-items:flex-start;flex-direction:column}.current-season-title>div{display:block}.current-season-title p{margin:0}.courgette-photo{max-height:480px}}`;doc.head.appendChild(style)}
function buildSeason(doc,year,entries,beforeYear){const main=doc.querySelector('main');if(!main||doc.querySelector(`[data-injected-season="${year}"]`))return;styleInjected(doc);const season=doc.createElement('section');season.className='injected-season';season.dataset.injectedSeason=year;const months=[...new Set(entries.map(e=>e.month))];season.innerHTML=`<div class="current-season-title"><div><span class="current-kicker">MILLÉSIME</span><h2>${year}</h2></div><p>${entries.length} courgettes retrouvées</p></div>`+months.map(month=>`<section class="month-block injected-month" data-year="${year}"><h2>${esc(month)}</h2><div class="injected-grid">${entries.filter(e=>e.month===month).map(e=>{const body=e.photo?`<div class="courgette-photo-wrap"><img class="courgette-photo" src="${esc(e.photo)}" alt="${esc(e.name)}" loading="lazy"></div>`:`<p class="injected-text">${esc(e.text)}</p>`;return `<article class="quote-card injected-card" data-year="${year}" data-rank="${esc(e.rank)}" data-search="${esc(norm(e.name+' '+month+' '+e.rank+' '+(e.text||'')))}"><div class="injected-rank rank-${norm(e.rank)}">${e.rank==='Or'?'🥇':e.rank==='Argent'?'🥈':e.rank==='Bronze'?'🥉':'★'} ${esc(e.rank)}</div><h3>${esc(e.name)}</h3>${body}</article>`}).join('')}</div></section>`).join('');const first=main.querySelector(`.quote-card[data-year="${beforeYear}"]`);let anchor=first;while(anchor&&anchor.parentElement!==main)anchor=anchor.parentElement;if(anchor)main.insertBefore(season,anchor);else main.appendChild(season);}
function removeArchiveNotice(doc){[...doc.querySelectorAll('body *')].forEach(el=>{const t=(el.textContent||'').trim();if(el.children.length<6&&t.includes('Archives complétées')&&t.includes('Even')&&t.includes('Enzo'))el.style.display='none';});}
function setup(doc){buildSeason(doc,'2025-2026',entries2025,'2024-2025');buildSeason(doc,'2023-2024',entries2023,'2018-2019');buildSeason(doc,'2022-2023',entries2022,'2018-2019');removeArchiveNotice(doc);let mode='all';const controls=()=>[...doc.querySelectorAll('button,a,[role="button"]')];function ensureButton(year,before){let b=controls().find(el=>new RegExp('^\\s*'+year.replace('-','\\s*[-–]\\s*')+'\\s*$').test(el.textContent||''));if(b)return b;const ref=controls().find(el=>new RegExp('^\\s*'+before.replace('-','\\s*[-–]\\s*')+'\\s*$').test(el.textContent||''));if(!ref)return null;b=ref.cloneNode(true);b.textContent=year;for(const a of [...b.attributes])if(a.value.includes(before))b.setAttribute(a.name,a.value.replaceAll(before,year));if(b.tagName==='A')b.href='#';ref.parentNode.insertBefore(b,ref);return b}const b25=ensureButton('2025-2026','2024-2025'),b23=ensureButton('2023-2024','2018-2019'),b22=ensureButton('2022-2023','2018-2019');const injected=[[b25,'2025-2026'],[b23,'2023-2024'],[b22,'2022-2023']];function active(btn,on){if(!btn)return;btn.style.background=on?'#8f1738':'';btn.style.color=on?'#fff':'';btn.style.borderColor=on?'#a83050':'';btn.setAttribute('aria-pressed',on?'true':'false')}function clearActive(){injected.forEach(([b])=>active(b,false))}function stats(){[...doc.querySelectorAll('body *')].forEach(el=>{if(el.children.length===0){const t=(el.textContent||'').trim();if(/^\d+ millésimes publiés retrouvés$/.test(t))el.textContent='8 millésimes publiés retrouvés';if(/^\d+ courgettes affichées$/.test(t))el.textContent='227 courgettes affichées';}})}function sync(){doc.querySelectorAll('.injected-season').forEach(s=>{const y=s.dataset.injectedSeason;const show=mode==='all'||mode===y||mode==='outsiders';s.style.display=show?'':'none';if(show)s.querySelectorAll('.injected-month').forEach(m=>{const any=[...m.querySelectorAll('.injected-card')].some(c=>getComputedStyle(c).display!=='none');m.style.display=any?'':'none'})});stats();removeArchiveNotice(doc)}injected.forEach(([b,y])=>{if(!b)return;b.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();mode=y;childRun(doc,`try{year='${y}';apply();}catch(e){}`);clearActive();active(b,true);setTimeout(sync,0)})});controls().forEach(el=>{if(injected.some(([b])=>el===b))return;const t=(el.textContent||'').trim();if(/^\d{4}\s*[-–]\s*\d{4}$/.test(t))el.addEventListener('click',()=>{mode=t.replace(/\s/g,'').replace('–','-');clearActive();setTimeout(sync,0)});else if(/^Toutes$/i.test(t))el.addEventListener('click',()=>{mode='all';clearActive();setTimeout(sync,0)});else if(/^Outsiders$/i.test(t))el.addEventListener('click',()=>{mode='outsiders';clearActive();setTimeout(sync,0)})});const search=doc.querySelector('input[type="search"],input[placeholder*="Prénom"],input[placeholder*="prenom" i]');if(search)search.addEventListener('input',()=>setTimeout(sync,0));childRun(doc,`try{cards.push(...document.querySelectorAll('.injected-card'));apply();}catch(e){}`);stats();setTimeout(sync,0)}
document.getElementById('archives').addEventListener('load',function(){try{const doc=this.contentDocument;setup(doc);doc.title="Les Courgettes d'Or — Archives";}catch(e){console.error(e)}});
</script>
