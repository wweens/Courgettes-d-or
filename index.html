<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les Courgettes d'Or — Archives</title>
<style>html,body,#archives{width:100%;height:100%;margin:0;border:0;display:block;background:#f5eddf}body{overflow:hidden}</style>
</head>
<body>
<iframe id="archives" src="archives.html" title="Les Courgettes d'Or"></iframe>
<script src="data-2025-2026.js"></script>
<script src="data-2024-2025.js"></script>
<script src="data-2023-2021.js"></script>
<script src="data-2018-2015.js"></script>
<script src="data-2014-2015.js"></script>
<script src="data-2013-2014.js"></script>
<script>
const docEntries=window.COURGETTES_DOC_DATA||[];
const seasonOrder=["2025-2026","2024-2025","2023-2024","2022-2023","2021-2022","2018-2019","2015-2016","2014-2015","2013-2014"];
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function collectLegacyPhotos(doc){const a=[];doc.querySelectorAll('.quote-card').forEach(card=>{const img=card.querySelector('img');if(!img)return;const year=card.dataset.year||card.closest('[data-year]')?.dataset.year||'';a.push({year,text:(card.textContent||'').trim(),src:img.currentSrc||img.src||img.getAttribute('src')||''})});return a}
function findLegacyPhoto(e,photos){if(e.photo)return e.photo;const same=photos.filter(p=>p.year===e.year&&p.src);const n=norm(e.name);const exact=same.find(p=>norm(p.text).includes(n));if(exact)return exact.src;if(same.length===1)return same[0].src;return ''}
function addStyle(doc){if(doc.getElementById('doc-courgettes-style'))return;const s=doc.createElement('style');s.id='doc-courgettes-style';s.textContent=`#doc-seasons-root{display:block}.doc-season{margin-bottom:2.8rem}.doc-season-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin:0 0 1.35rem;padding:.25rem 0;border-bottom:3px solid #7e2335}.doc-season-head>div{display:flex;align-items:baseline;gap:1rem}.doc-season-head h2{margin:0;color:#8b2438;font-family:Georgia,serif;font-size:clamp(2.1rem,5vw,3.3rem)}.doc-season-head p{margin:0 0 .45rem;opacity:.65;font-weight:700}.doc-kicker{font-weight:900;letter-spacing:.08em;color:#806d5d}.doc-month>h2{margin-top:1.6rem}.doc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:1rem;margin:1rem 0 2rem}.doc-card{box-sizing:border-box}.doc-rank{display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0 0 .35rem;padding:.3rem .55rem;border-radius:999px;background:rgba(0,0,0,.06)}.doc-rank-or{background:#f2d77b}.doc-rank-argent{background:#d8dde3}.doc-rank-bronze{background:#dfb183}.doc-rank-outsider{background:#ead8dc}.doc-rank-bonus{background:#e6d9a5}.doc-text{font-size:1rem;line-height:1.55;margin:.7rem 0 0;white-space:pre-wrap}.doc-photo-wrap{width:100%;margin-top:.75rem;border-radius:12px;overflow:hidden;background:#eee7dc;display:flex;align-items:center;justify-content:center}.doc-photo{display:block;width:100%;height:auto;max-height:620px;object-fit:contain}.doc-photo-missing{white-space:pre-wrap;font-style:italic;opacity:.75}@media(max-width:640px){.doc-season-head{align-items:flex-start;flex-direction:column}.doc-season-head>div{display:block}.doc-season-head p{margin:0}.doc-photo{max-height:480px}}`;doc.head.appendChild(s)}
function badge(doc,e){if(e.noBadge)return null;const d=doc.createElement('div');const r=norm(e.rank);d.className=`doc-rank doc-rank-${r}`;const icon=e.rank==='Or'?'🥇':e.rank==='Argent'?'🥈':e.rank==='Bronze'?'🥉':e.rank==='Outsider'?'★':'✦';d.textContent=`${icon} ${e.rank}`;return d}
function build(doc){const main=doc.querySelector('main');if(!main)return;const photos=collectLegacyPhotos(doc);[...main.children].forEach(x=>x.style.display='none');addStyle(doc);const old=doc.getElementById('doc-seasons-root');if(old)old.remove();const root=doc.createElement('div');root.id='doc-seasons-root';main.prepend(root);seasonOrder.forEach(year=>{const list=docEntries.filter(e=>e.year===year);if(!list.length)return;const season=doc.createElement('section');season.className='doc-season';season.dataset.year=year;const head=doc.createElement('div');head.className='doc-season-head';const left=doc.createElement('div');const k=doc.createElement('span');k.className='doc-kicker';k.textContent='MILLÉSIME';const h=doc.createElement('h2');h.textContent=year;left.append(k,h);const count=doc.createElement('p');count.textContent=`${list.length} courgettes`;head.append(left,count);season.appendChild(head);[...new Set(list.map(e=>e.section))].forEach(section=>{const block=doc.createElement('section');block.className='month-block doc-month';block.dataset.year=year;const mh=doc.createElement('h2');mh.textContent=section;block.appendChild(mh);const grid=doc.createElement('div');grid.className='doc-grid';list.filter(e=>e.section===section).forEach(e=>{const card=doc.createElement('article');card.className='quote-card doc-card';card.dataset.year=year;card.dataset.rank=e.rank;card.dataset.search=norm(`${e.name} ${section} ${e.rank} ${e.text}`);const b=badge(doc,e);if(b)card.appendChild(b);const nh=doc.createElement('h3');nh.textContent=e.name;card.appendChild(nh);if(e.isPhoto){const src=findLegacyPhoto(e,photos);if(src){const wrap=doc.createElement('div');wrap.className='doc-photo-wrap';const img=doc.createElement('img');img.className='doc-photo';img.src=src;img.alt=e.name;img.loading='lazy';wrap.appendChild(img);card.appendChild(wrap)}else{const t=doc.createElement('div');t.className='doc-text doc-photo-missing';t.textContent=e.text;card.appendChild(t)}}else{const t=doc.createElement('div');t.className='doc-text';t.textContent=e.text;card.appendChild(t)}grid.appendChild(card)});block.appendChild(grid);season.appendChild(block)});root.appendChild(season)});setupControls(doc,root)}
function setupControls(doc,root){let mode='all',q='';const controls=()=>[...doc.querySelectorAll('button,a,[role="button"]')];const cleanYear=t=>(t||'').trim().replace(/\s/g,'').replace('–','-');function ensureYearButton(y){let b=controls().find(el=>cleanYear(el.textContent)===y);if(b)return b;const ref=controls().find(el=>/^\d{4}-\d{4}$/.test(cleanYear(el.textContent)));if(!ref)return null;b=ref.cloneNode(true);b.textContent=y;for(const a of [...b.attributes])if(/\d{4}[-–]\d{4}/.test(a.value))b.setAttribute(a.name,a.value.replace(/\d{4}[-–]\d{4}/,y));if(b.tagName==='A')b.href='#';ref.parentNode.appendChild(b);return b}const yearButtons=seasonOrder.map(y=>[ensureYearButton(y),y]);function active(btn,on){if(!btn)return;btn.style.background=on?'#8f1738':'';btn.style.color=on?'#fff':'';btn.style.borderColor=on?'#a83050':'';btn.setAttribute('aria-pressed',on?'true':'false')}function clearActive(){yearButtons.forEach(([b])=>active(b,false))}function apply(){root.querySelectorAll('.doc-card').forEach(c=>{const y=c.dataset.year,r=norm(c.dataset.rank),s=c.dataset.search||'';const okMode=mode==='all'||mode===y||(mode==='outsiders'&&r==='outsider');c.style.display=okMode&&(!q||s.includes(q))?'':'none'});root.querySelectorAll('.doc-month').forEach(m=>{m.style.display=[...m.querySelectorAll('.doc-card')].some(c=>c.style.display!=='none')?'':'none'});root.querySelectorAll('.doc-season').forEach(s=>{s.style.display=[...s.querySelectorAll('.doc-card')].some(c=>c.style.display!=='none')?'':'none'});[...doc.querySelectorAll('body *')].forEach(el=>{if(el.children.length===0){const t=(el.textContent||'').trim();if(/^\d+ millésimes publiés retrouvés$/.test(t))el.textContent='9 millésimes publiés retrouvés';if(/^\d+ courgettes affichées$/.test(t))el.textContent='248 courgettes affichées'}})}yearButtons.forEach(([b,y])=>{if(!b)return;b.addEventListener('click',ev=>{ev.preventDefault();ev.stopImmediatePropagation();mode=y;clearActive();active(b,true);apply()},true)});controls().forEach(el=>{if(yearButtons.some(([b])=>b===el))return;const t=(el.textContent||'').trim();if(/^Toutes$/i.test(t))el.addEventListener('click',ev=>{ev.preventDefault();ev.stopImmediatePropagation();mode='all';clearActive();apply()},true);else if(/^Outsiders$/i.test(t))el.addEventListener('click',ev=>{ev.preventDefault();ev.stopImmediatePropagation();mode='outsiders';clearActive();apply()},true)});const search=doc.querySelector('input[type="search"],input[placeholder*="Prénom"],input[placeholder*="prenom" i]');if(search)search.addEventListener('input',()=>{q=norm(search.value);apply()},true);apply()}
document.getElementById('archives').addEventListener('load',function(){try{build(this.contentDocument);this.contentDocument.title="Les Courgettes d'Or — Archives"}catch(e){console.error(e)}});
</script>
</body>
</html>
